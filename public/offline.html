<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#843f13">
  <title>Offline — NLUJA AEMS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f6f3; color: #1f1a17; font: 16px/1.5 system-ui, "Segoe UI", "Noto Sans", sans-serif; }
    .card { max-width: 22rem; margin: 1.5rem; padding: 2rem 1.5rem; background: #fff; border: 1px solid #e6dfd7; border-radius: 1rem; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: .75rem 0 .25rem; color: #843f13; }
    p { margin: .5rem 0; color: #6b625b; font-size: .95rem; }
    button { margin-top: 1rem; padding: .6rem 1.25rem; border: 0; border-radius: .5rem; background: #843f13; color: #fff; font-size: .95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/emblem.png" alt="NLUJA emblem">
    <h1>You are offline</h1>
    <p>NLUJA AEMS needs an internet connection to show your records. Your data is never stored on this device.</p>
    <p lang="as">আপুনি অফলাইন আছে — সংযোগ পুনৰ আহিলে আকৌ চেষ্টা কৰক।</p>
    <p lang="hi">आप ऑफ़लाइन हैं — कनेक्शन लौटने पर फिर से प्रयास करें।</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
